name: Sketchboard
options:
  bundleIdPrefix: com.silverlionapps
  deploymentTarget:
    iOS: "18.0"
targets:
  Sketchboard:
    type: application
    platform: iOS
    sources:
      - path: Sketchboard
        excludes: ["Config/*.xcconfig*"]
    # Optional, git-ignored. Copy Sketchboard/Config/Secrets.xcconfig.example to Secrets.xcconfig.
    # Missing file = empty values; the app's Settings sheet can supply them at runtime instead.
    configFiles:
      Debug: Sketchboard/Config/Secrets.xcconfig
      Release: Sketchboard/Config/Secrets.xcconfig
    info:
      path: Sketchboard/Info.plist
      properties:
        GemmaBaseURL: $(GEMMA_BASE_URL)
        GemmaToken: $(GEMMA_TOKEN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        NSLocalNetworkUsageDescription: Talks to the Gemma server on your local network.
        NSAppTransportSecurity: {NSAllowsArbitraryLoads: true}  # ponytail: hackathon only, plain HTTP to the Gemma box
    settings:
      TARGETED_DEVICE_FAMILY: "2"
      CODE_SIGN_STYLE: Automatic
      # Personal Teams can't share one App ID. Each dev sets BUNDLE_ID_SUFFIX (e.g. ".ari")
      # in the git-ignored Secrets.xcconfig; empty for the shared/CI id.
      PRODUCT_BUNDLE_IDENTIFIER: com.silverlionapps.Sketchboard$(BUNDLE_ID_SUFFIX)
